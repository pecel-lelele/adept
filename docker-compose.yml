# Local PostgreSQL only; web/API run through the workspace artifact commands.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adept}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adept}
      POSTGRES_DB: ${POSTGRES_DB:-adept}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: adept-api:latest
    build:
      context: .
      dockerfile: src/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-adept}:${POSTGRES_PASSWORD:-adept}@db:5432/${POSTGRES_DB:-adept}
      - APP_ENV=development
      - AUTH_MODE=demo
      - WEB_ORIGIN=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @workspace/adept dev"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/src/web/node_modules
      - /workspace/src/web/.next
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
