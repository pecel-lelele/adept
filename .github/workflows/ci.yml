# CI: the `make check` quality gate split into backend and frontend jobs that run in
# parallel, plus a contract-drift check, a real database and a production web build.
# Structure adapted from KerjaCerdas .github/workflows/ci.yml (gated jobs, concurrency,
# pgvector service for migrations).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.3"

jobs:
  minilm-workflow:
    name: MiniLM workflow syntax and publication policy (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # Workflow files only: this job never runs the publisher.
      - name: Lint workflow syntax
        env:
          GOTOOLCHAIN: auto
          GOSUMDB: sum.golang.org
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/publish-minilm.yml .github/workflows/data-sources.yml .github/workflows/trends-refresh.yml

      - name: Test unsafe workflow fixtures (offline)
        run: uv run --no-project --python "$PYTHON_VERSION" --with PyYAML==6.0.3 python -m unittest discover -s tests/pipelines/trends -p test_minilm_publish_workflow.py -v

      - name: Check publication policy and public pinned action manifests
        run: uv run --no-project --python "$PYTHON_VERSION" --with PyYAML==6.0.3 python src/scripts/check_minilm_workflow.py --check-actions

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies into .venv
        run: |
          uv sync --frozen --python "$PYTHON_VERSION"

      - name: Ruff lint
        run: .venv/bin/python -m ruff check .

      - name: Ruff format
        run: .venv/bin/python -m ruff format --check .

      - name: Pytest
        run: .venv/bin/python -m pytest

  frontend:
    name: Frontend (eslint, typecheck, i18n, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter @workspace/adept lint

      - name: TypeScript
        run: pnpm typecheck

      # The same file list `make check` uses: every tests/*.test.ts|mjs except live-server tests.
      - name: Web component, proxy, navigation, privacy and asset regressions
        run: python3 src/scripts/dev.py web-test

      # Stdlib-only script: no virtualenv needed.
      - name: Translation keys match English
        run: python3 src/scripts/dev.py i18n-check

      - name: Next.js production build
        env:
          API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      # /privacy must render in every locale from the production build (loopback only).
      - name: Privacy page over HTTP from the production build
        env:
          API_URL: http://127.0.0.1:9
          HOSTNAME: 127.0.0.1
          PORT: "3107"
          PROXY_SHARED_SECRET: ci-privacy-http-only
          NEXT_TELEMETRY_DISABLED: "1"
          ADEPT_PRIVACY_TEST_ORIGIN: http://127.0.0.1:3107
        run: |
          pnpm --filter @workspace/adept start > "$RUNNER_TEMP/web.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl --silent --fail --output /dev/null "$ADEPT_PRIVACY_TEST_ORIGIN/privacy" && break
            sleep 1
          done
          node --test tests/privacy-http.test.mjs || { cat "$RUNNER_TEMP/web.log"; exit 1; }

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install isolated API test runtime
        run: uv sync --frozen --python "$PYTHON_VERSION"

  e2e:
    name: Browser journeys (Playwright, desktop and mobile)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install isolated API test runtime
        run: uv sync --frozen --python "$PYTHON_VERSION"

      - name: Next.js production build (served by the e2e launcher)
        env:
          API_URL: http://127.0.0.1:18091
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser smoke-test runtime
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browser system dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Desktop and mobile synthetic browser journeys
        run: pnpm exec playwright test

  contracts:
    name: API contracts in sync (OpenAPI + TypeScript types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python dependencies into .venv
        run: |
          uv sync --frozen --python "$PYTHON_VERSION"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate contracts and fail on drift
        run: python3 src/scripts/dev.py contracts-check

  database:
    name: Migrations and seeds on PostgreSQL 16 + pgvector
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adept
          POSTGRES_PASSWORD: adept-ci-only
          POSTGRES_DB: adept
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adept -d adept"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://adept:adept-ci-only@localhost:5432/adept
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the skeleton commit is needed for the upgrade test

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies
        run: |
          uv sync --frozen --python "$PYTHON_VERSION"

      # Upgrade path: build the database exactly as the merged skeleton did (its own
      # migrations and mock seeds), then apply today's migrations and seeds on top.
      - name: Seed a database from the skeleton release
        run: |
          mkdir -p "$RUNNER_TEMP/skeleton"
          git archive "$SKELETON_SHA" src/db src/data/seed | tar -x -C "$RUNNER_TEMP/skeleton"
          .venv/bin/python "$RUNNER_TEMP/skeleton/src/db/migrate.py" up
          .venv/bin/python "$RUNNER_TEMP/skeleton/src/db/seed.py"
        env:
          SKELETON_SHA: 010f048e0bafc81d7734061939dc366f9ccaf3f8

      - name: Apply migrations
        run: .venv/bin/python src/db/migrate.py up

      - name: Load seeds
        run: .venv/bin/python src/db/seed.py

      - name: Trend preflight accepts the migrated writable database
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.trends.preflight

      # Re-running must be a no-op: migrations are recorded, seeds use ON CONFLICT DO NOTHING.
      - name: Migrations and seeds are idempotent
        run: |
          .venv/bin/python src/db/migrate.py up | tee migrate.out
          grep -q "0 migration(s) applied" migrate.out
          .venv/bin/python src/db/seed.py

      - name: Seeded data matches the catalogue and SDG rules
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM sdg_goals) <> 17 THEN RAISE EXCEPTION 'expected 17 goals'; END IF;
            IF (SELECT count(*) FROM sdg_targets) <> 169 THEN RAISE EXCEPTION 'expected 169 targets'; END IF;
            IF EXISTS (SELECT 1 FROM sdg_targets WHERE retrieved_at IS NULL)
              THEN RAISE EXCEPTION 'a skeleton SDG target survived the upgrade'; END IF;
            IF EXISTS (SELECT 1 FROM roles r WHERE NOT EXISTS
                       (SELECT 1 FROM role_sdg_map m WHERE m.role_id = r.id))
              THEN RAISE EXCEPTION 'a role has no SDG link'; END IF;
            IF EXISTS (SELECT 1 FROM skills s WHERE NOT EXISTS
                       (SELECT 1 FROM skill_sdg_map m WHERE m.skill_id = s.id))
              THEN RAISE EXCEPTION 'a skill has no SDG link'; END IF;
            IF EXISTS (SELECT 1 FROM role_sdg_map WHERE reason ILIKE '%mock%' OR evidence_url = ''
                       UNION ALL
                       SELECT 1 FROM skill_sdg_map WHERE reason ILIKE '%mock%' OR evidence_url = '')
              THEN RAISE EXCEPTION 'an SDG link is a mock or has no evidence'; END IF;
            IF EXISTS (SELECT 1 FROM courses WHERE url NOT LIKE 'https://%' OR source_url = ''
                       OR url LIKE 'https://example.org/%')
              THEN RAISE EXCEPTION 'a course is a placeholder or lacks an https URL or source'; END IF;
          END $$;
          SQL

      # Plans, progress, badges, reference reads, live sync (from fixtures) and shared rate
      # limits against the real database.
      - name: PostgreSQL integration tests
        run: |
          .venv/bin/python -m pytest -q tests/api/pathway/test_postgres_store.py tests/api/pathway/test_postgres_refdata.py tests/api/pathway/test_postgres_sync.py tests/api/pathway/test_earned_levels.py tests/api/guardrails/test_rate_limit_postgres.py tests/pipelines/jobs/test_postgres_refresh.py tests/integration/test_database_recovery.py tests/pipelines/trends/test_mock_fixture_consistency.py
        env:
          ADEPT_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  deployment:
    name: Root deployment smoke (one public server)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adept
          POSTGRES_PASSWORD: adept-smoke-only
          POSTGRES_DB: adept_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adept -d adept_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://adept:adept-smoke-only@127.0.0.1:5432/adept_smoke
      ADEPT_SMOKE_DATABASE_URL: postgresql://adept:adept-smoke-only@127.0.0.1:5432/adept_smoke
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Python from the lockfile
        run: uv sync --frozen --python "$PYTHON_VERSION"
      - name: Run the exact root Replit build command
        run: python3 src/scripts/replit.py build
      - name: Prepare only the disposable CI database
        run: |
          .venv/bin/python src/db/migrate.py up
          .venv/bin/python src/db/seed.py
      - name: Check the supervised production server and public routes
        run: .venv/bin/python src/scripts/smoke_deployment.py
