# Publish the RunPod MiniLM worker image to GitHub Container Registry.
#
# RunPod pulls the image from ghcr.io/pecel-lelele/adept-minilm:latest when a
# Serverless job starts a new worker. No RunPod API key or endpoint ID is needed
# here: this workflow only builds and publishes. See src/pipelines/trends/runpod/README.md.
#
# The image is public so RunPod can pull it without registry credentials.
# Configure the endpoint in RunPod, then set TRENDS_RUNPOD_ENDPOINT_ID (Actions variable)
# and TRENDS_RUNPOD_API_KEY (Actions secret) to enable the weekly Trends refresh.
name: Publish MiniLM worker

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/pipelines/trends/runpod/**"
      - "src/pipelines/trends/encoder.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # needed to push to ghcr.io

concurrency:
  group: publish-minilm
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push adept-minilm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730d6d88ba04b3523a3f7c12b9b1f6e3bbaacc # v3

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171e8e2cb8a6f9a03c3 # v6
        with:
          context: .
          file: src/pipelines/trends/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/adept-minilm:latest
            ghcr.io/${{ github.repository_owner }}/adept-minilm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
