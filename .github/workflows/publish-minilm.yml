# Publish only from trusted main/deployment refs. No PR can reach credentials.
name: Publish MiniLM

on:
  push:
    branches:
      - main
      - feat/minilm-runpod-deploy
    paths:
      - .github/workflows/publish-minilm.yml
      - src/pipelines/trends/runpod/**
      - src/pipelines/trends/encoder.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-minilm-latest
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pecel-lelele/adept' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/minilm-runpod-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the existing worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/pipelines/trends/runpod/Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'pecel-lelele/adept' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/minilm-runpod-deploy') }}
          tags: |
            ghcr.io/pecel-lelele/adept-minilm:latest
            ghcr.io/pecel-lelele/adept-minilm:${{ github.sha }}
            ghcr.io/pecel-lelele/adept-minilm:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
