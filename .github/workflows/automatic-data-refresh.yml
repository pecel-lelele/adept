name: Automatic app data refresh
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automatic-app-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.repository == 'pecel-lelele/adept'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Start app job and poll its outcome
        env:
          DATA_REFRESH_APP_URL: ${{ vars.DATA_REFRESH_APP_URL }}
          DATA_REFRESH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: python src/scripts/call_data_refresh.py
