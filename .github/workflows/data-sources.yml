# Weekly check that the live public sources behind the catalogue and SDG list still answer
# and still contain what we rely on (e.g. a curated Microsoft Learn module was not retired).
# It does not commit anything; a failure means someone should rerun the pipeline and review.
name: Data sources

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies from lockfile
        run: uv sync --frozen --python 3.11

      - name: UN SDG API still returns 17 goals and their targets
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.sdg.run --out "$RUNNER_TEMP/sdg"

      - name: Microsoft Learn still lists every curated course
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.pathway.run --out "$RUNNER_TEMP/courses.csv"

      - name: Coursera still lists every curated course
        run: |
          PYTHONPATH=src/api:src .venv/bin/python - <<'PY'
          from app.features.pathway.catalogue_sources import COURSERA, coursera_status
          gone = [r.provider_ref for r in COURSERA if coursera_status(r.provider_ref) is False]
          if gone:
              raise SystemExit(f"Coursera no longer lists: {gone}")
          PY

      - name: Course pages and SDG evidence links still resolve
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.guardrails.check_links

      - name: Report differences from the committed seed
        run: |
          diff <(cut -d, -f1-3 src/data/seed/sdg/sdg_targets.csv) <(cut -d, -f1-3 "$RUNNER_TEMP/sdg/sdg_targets.csv") || echo "::warning::SDG targets changed upstream"
          diff <(cut -d, -f1-5 src/data/seed/courses/courses.csv) <(cut -d, -f1-5 "$RUNNER_TEMP/courses.csv") || echo "::warning::Course catalogue changed upstream; rerun pipelines.pathway"
