# Weekly check that the live public sources behind the catalogue and SDG list still answer
# and still contain what we rely on (e.g. a curated Microsoft Learn module was not retired).
# It does not commit anything; a failure means someone should rerun the pipeline and review.
# The jobs-refresh job fetches live job openings (src/pipelines/jobs) every week and writes
# them to the deployment database only when the JOBS_DATABASE_URL secret is set; keyed job
# boards run only when their own secrets are set.
name: Data sources

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies from lockfile
        run: uv sync --frozen --python 3.11

      - name: UN SDG API still returns 17 goals and their targets
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.sdg.run --out "$RUNNER_TEMP/sdg"

      - name: Microsoft Learn still lists every curated course
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.pathway.run --out "$RUNNER_TEMP/courses.csv"

      - name: Coursera still lists every curated course
        run: |
          PYTHONPATH=src/api:src .venv/bin/python - <<'PY'
          from app.features.pathway.catalogue_sources import COURSERA, coursera_status
          gone = [r.provider_ref for r in COURSERA if coursera_status(r.provider_ref) is False]
          if gone:
              raise SystemExit(f"Coursera no longer lists: {gone}")
          PY

      - name: Course pages and SDG evidence links still resolve
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.guardrails.check_links

      - name: Report differences from the committed seed
        run: |
          diff <(cut -d, -f1-3 src/data/seed/sdg/sdg_targets.csv) <(cut -d, -f1-3 "$RUNNER_TEMP/sdg/sdg_targets.csv") || echo "::warning::SDG targets changed upstream"
          diff <(cut -d, -f1-5 src/data/seed/courses/courses.csv) <(cut -d, -f1-5 "$RUNNER_TEMP/courses.csv") || echo "::warning::Course catalogue changed upstream; rerun pipelines.pathway"

  jobs-refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    timeout-minutes: 20
    concurrency:
      group: jobs-refresh
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      CAREERJET_LOCALE: en_MY
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      WEB3_CAREER_TOKEN: ${{ secrets.WEB3_CAREER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies from lockfile
        run: uv sync --frozen --python 3.11

      # Without the database secret the run still fetches and classifies (a source check) but
      # writes only the runner's working copy, which is discarded; nothing is committed.
      - name: Fetch and classify job openings (no database write)
        if: env.DATABASE_URL == ''
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::notice::JOBS_DATABASE_URL is not set; running without a database write."
          fi
          PYTHONPATH=src/api:src .venv/bin/python -m pipelines.jobs.run

      - name: Fetch, classify and upsert job openings into the deployment database
        if: env.DATABASE_URL != ''
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.jobs.run --db

      - name: Summarise the fetch
        if: always()
        run: |
          if [[ -f src/data/seed/jobs/fetch_log.json ]]; then
            PYTHONPATH=src/api:src .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          log = json.load(open("src/data/seed/jobs/fetch_log.json", encoding="utf-8"))
          ok = sum(1 for b in log["boards"] if b["status"] == "ok")
          print(f"Jobs fetch {log['fetched_on']}: {ok}/{len(log['boards'])} boards ok")
          PY
          fi
