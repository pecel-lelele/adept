# Weekly trend refresh (F2, handoff H01): ingest this week's arXiv cs.AI listing, score it against
# the previous week, validate, and publish one new snapshot to the deployment database.
# A failed run publishes nothing, so the last valid snapshot stays live.
# Needs TREND_DATABASE_URL and TRENDS_RUNPOD_API_KEY secrets, plus the
# TRENDS_RUNPOD_ENDPOINT_ID repository variable. Missing configuration fails manual runs.
name: Trends refresh

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC, after the data-source check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trends-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.TREND_DATABASE_URL }}
      TRENDS_EMBEDDING_BACKEND: runpod
      TRENDS_RUNPOD_ENDPOINT_ID: ${{ vars.TRENDS_RUNPOD_ENDPOINT_ID }}
      TRENDS_RUNPOD_API_KEY: ${{ secrets.TRENDS_RUNPOD_API_KEY }}
    steps:
      - name: Check incomplete deployment configuration
        if: env.DATABASE_URL == '' || env.TRENDS_RUNPOD_ENDPOINT_ID == '' || env.TRENDS_RUNPOD_API_KEY == ''
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Required deployment configuration is missing."
            exit 1
          fi
          echo "::notice::Deployment configuration is incomplete; scheduled refresh skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''

      - name: Install pipeline client dependencies from lockfile
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''
        run: |
          uv sync --frozen --python 3.11

      - name: Verify database access before inference
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''
        timeout-minutes: 1
        run: PYTHONPATH=src/api:src .venv/bin/python -m pipelines.trends.preflight

      - name: Ingest, score, validate and publish
        if: env.DATABASE_URL != '' && env.TRENDS_RUNPOD_ENDPOINT_ID != '' && env.TRENDS_RUNPOD_API_KEY != ''
        run: |
          set -euo pipefail
          PYTHONPATH=src/api:src .venv/bin/python -m pipelines.trends.run | tee "$RUNNER_TEMP/trends-refresh.log"
          snapshot_date="$(sed -nE 's/^Published snapshot ([0-9]{4}-[0-9]{2}-[0-9]{2})\.$/\1/p' "$RUNNER_TEMP/trends-refresh.log")"
          if [[ -z "$snapshot_date" ]]; then
            echo "::error::The publisher did not confirm a snapshot date."
            exit 1
          fi
          printf 'Published snapshot: **%s**\n' "$snapshot_date" >> "$GITHUB_STEP_SUMMARY"
