kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api/v1", "/api/healthz"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
APP_ENV = "production"
M3_BACKEND = "postgres"
AUTH_MODE = "demo"
AUTH_RAW_USER_IDS = "false"
AUTH_DEFAULT_USER = ""
LLM_PROVIDER = "runpod"
LLM_MODEL = "glm-5.3"
LLM_BASE_URL = "https://api.runpod.ai/v2/b1dd8hy2hqo1nb/openai/v1"
LLM_FALLBACK_PROVIDER = "gemini"
LLM_FALLBACK_MODEL = "gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.1-flash-lite"
LLM_TIMEOUT_S = "20"

[services.production.health.startup]
path = "/api/healthz"
