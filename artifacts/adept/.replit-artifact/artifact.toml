kind = "web"
previewPath = "/"
title = "Adept"
description = "Adept's original Next.js app for career matching and personalised reskilling."
version = "1.0.0"
id = "artifacts/adept"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 24384

[services.development]
run = "npx --yes pnpm@10.29.3 --filter @workspace/adept run dev"

[services.production.build]
args = ["npx", "--yes", "pnpm@10.29.3", "--filter", "@workspace/adept", "run", "build"]

[services.production.run]
args = ["node", "src/web/scripts/start-standalone.mjs"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "24384"
API_URL = "http://127.0.0.1:8000"
NEXT_TELEMETRY_DISABLED = "1"

[services.env]
PORT = "24384"
BASE_PATH = "/"
API_URL = "http://127.0.0.1:8000"
