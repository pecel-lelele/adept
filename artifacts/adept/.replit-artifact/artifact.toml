kind = "web"
previewPath = "/"
title = "Adept"
description = "Adept's original Next.js app for career matching and personalised reskilling."
version = "1.0.0"
id = "artifacts/adept"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 24384

[services.development]
run = "pnpm --filter @workspace/adept run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/adept", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/adept", "run", "start"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "24384"
API_URL = "http://127.0.0.1:8000"
NEXT_TELEMETRY_DISABLED = "1"

[services.env]
PORT = "24384"
BASE_PATH = "/"
API_URL = "http://127.0.0.1:8000"
