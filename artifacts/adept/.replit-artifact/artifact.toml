kind = "web"
previewPath = "/"
title = "Adept"
description = "Career matching and personalised reskilling for the AI era, with individual, employee, and organisation workspaces."
version = "1.0.0"
id = "artifacts/adept"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24384

[services.development]
run = "pnpm --filter @workspace/adept run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adept", "run", "build" ]
serve = "static"
publicDir = "artifacts/adept/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24384"
BASE_PATH = "/"
