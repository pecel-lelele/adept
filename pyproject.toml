[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "David Kurniawan", email = "davidk.academic@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymupdf<2",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyyaml==6.0.3"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "src/web", "src/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/api", "src"]
addopts = "-q --import-mode=importlib"
