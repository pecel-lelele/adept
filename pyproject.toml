[project]
name = "adept"
version = "0.1.0"
description = "Explainable career matching and personalised reskilling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf<3",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.2",
    "uvicorn[standard]>=0.54.0",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "pygments>=2.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pyyaml==6.0.3"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "src/web", "src/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/api", "src"]
addopts = "-q --import-mode=importlib"
